<header class="d-flex flex-column align-items-center my-5 text-center">
    <h1 class="">Shorter Url</h1>
    <p class="text-body-secondary">Acortador de urls</p>
    {% if user.is_authenticated  %}
        <div class="d-flex gap-2">
            <a class="btn btn-link" href="{% url 'shorter:create' %}">Agregar nueva url</a>
            <form method="post" action="{% url 'shorter:logout' %}">
                {% csrf_token %}
                <button class="btn btn-outline-danger btn-sm" type="submit">Cerrar sesion</button>
            </form>
        </div>
    {% endif %}
</header>
