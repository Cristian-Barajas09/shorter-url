{% extends "shorter/base.html" %}

{% block content %}
    <section class="d-flex flex-column align-items-center justify-content-center py-5">
        <div class="text-center mb-5">
            <h2 class="display-5 fw-bold">Acorta tus enlaces al instante</h2>
            <p class="lead text-body-secondary">Gestiona y comparte tus URLs de forma sencilla y rapida.</p>
        </div>

        <div class="d-flex gap-3">
            {% if user.is_authenticated %}
                <a class="btn btn-success btn-lg px-4" href="{% url 'shorter:list' user.username %}">Ir a mis URLs</a>
            {% else %}
                <a class="btn btn-success btn-lg px-4" href="{% url 'shorter:login' %}">Iniciar sesion</a>
                {% comment %} <a class="btn btn-outline-secondary btn-lg px-4" href="{% url 'shorter:login' %}">Registrarse</a> {% endcomment %}
            {% endif %}
        </div>
    </section>
{% endblock content %}
