{% extends "shorter/base.html" %}

{% block content %}
    <section class="w-100 d-flex justify-content-center py-5">
        <div class="card shadow-sm" style="max-width: 420px; width: 100%;">
            <div class="card-body p-4 p-md-5">
                <h2 class="h4 mb-3 text-center">Iniciar sesion</h2>

                {% if form.errors %}
                    <div class="alert alert-danger">
                        Usuario o contrasena incorrectos. Intenta de nuevo.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label" for="id_username">Usuario</label>
                        <input class="form-control" type="text" name="username" id="id_username" autofocus required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="id_password">Contrasena</label>
                        <input class="form-control" type="password" name="password" id="id_password" required>
                    </div>

                    <button class="btn btn-success w-100" type="submit">Entrar</button>
                </form>

                <div class="text-center mt-3">
                    <a class="text-body-secondary small" href="{% url 'shorter:landing' %}">Volver al inicio</a>
                </div>
            </div>
        </div>
    </section>
{% endblock content %}
